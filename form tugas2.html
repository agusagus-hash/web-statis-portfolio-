<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>
<style>
    body {
        background-color: #2c4a6e;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        padding: 20px;
    }
    .container {
        background: #4a7aa5;
        padding: 15px;
        width: 700px;
        border-radius: 10px;
    }
    .form-box {
        background: #f8fbfc;
        border-radius: 10px;
        overflow: hidden;
    }
    .form-header {
        background: #e8eef3;
        text-align: center;
        padding: 20px;
        font-size: 28px;
        font-weight: bold;
        color: #333;
    }
    .form-body {
        padding: 20px 30px;
    }
    .row {
        display: flex;
        gap: 20px;
        margin-bottom: 15px;
    }
    .col {
        flex: 1;
    }
    label {
        display: block;
        font-size: 14px;
        color: #3aa99e;
        font-weight: 600;
        margin-bottom: 5px;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"],
    select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
        background: #fff;
    }
    input::placeholder {
        color: #ddd;
        font-size: 13px;
    }
    .radio-group, .check-group {
        display: flex;
        gap: 10px;
        font-size: 13px;
        color: #555;
    }
    .income-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    input[type="range"] {
        flex: 1;
        accent-color: #3aa99e;
    }
    .badge {
        background: #3aa99e;
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
    }
    .file-input {
        font-size: 13px;
    }
    textarea {
        width: 100%;
        height: 60px;
        border: 1px solid #ddd;
        border-radius: 4px;
    }
    .btn-area {
        text-align: right;
        margin-top: 15px;
    }
    .btn-create {
        background: #3aa99e;
        color: white;
        border: none;
        padding: 8px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="container">
  <div class="form-box">
    <div class="form-header">Create Account</div>
    <div class="form-body">
      <form>
        <div class="row">
            <div class="col">
                <label>First name *</label>
                <input type="text" placeholder="enter your first name">
            </div>
            <div class="col">
                <label>Last name</label>
                <input type="text" placeholder="enter your last name">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>Email*</label>
                <input type="email" placeholder="enter your email">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>Password *</label>
                <input type="password" placeholder="enter your password">
            </div>
            <div class="col">
                <label>Confirm Password *</label>
                <input type="password" placeholder="enter your password again">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>Gender:</label>
                <div class="radio-group">
                    <label style="color:#555; font-weight:normal"><input type="radio" name="gender"> Male</label>
                    <label style="color:#555; font-weight:normal"><input type="radio" name="gender"> Female</label>
                </div>
            </div>
            <div class="col">
                <label>Hobbies</label>
                <div class="check-group">
                    <label style="color:#555; font-weight:normal"><input type="checkbox"> Music</label>
                    <label style="color:#555; font-weight:normal"><input type="checkbox"> Sports</label>
                    <label style="color:#555; font-weight:normal"><input type="checkbox"> Travel</label>
                    <label style="color:#555; font-weight:normal"><input type="checkbox"> Movies</label>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>Source of Income</label>
                <select>
                    <option>Employed</option>
                    <option>Self-employed</option>
                    <option>Unemployed</option>
                    <option>Student</option>
                </select>
            </div>
            <div class="col">
                <label>Income</label>
                <div class="income-row">
                    <input type="range" min="0" max="100" value="20" id="incomeRange" oninput="document.getElementById('incomeVal').innerText=this.value+'K'">
                    <span class="badge" id="incomeVal">20K</span>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>Upload Profile Picture</label>
                <input type="file" class="file-input">
            </div>
            <div class="col">
                <label>Age</label>
                <div>18</div>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>Bio</label>
                <textarea></textarea>
            </div>
        </div>

        <div class="btn-area">
            <button type="submit" class="btn-create">Create</button>
        </div>

      </form>
    </div>
  </div>
</div>

<script>
    // biar slider 20K nya jalan kayak di foto
    const range = document.getElementById('incomeRange');
    const val = document.getElementById('incomeVal');
    range.addEventListener('input', () => {
        val.textContent = range.value + 'K';
    });
</script>

</body>
</html>
