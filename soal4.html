<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Soal 4 - Colspan & Rowspan</title>
</head>
<body>

    <table border="1" cellpadding="5">
        <tr>
            <th colspan="4">Jadwal Kegiatan</th>
        </tr>
        <tr>
            <th>Hari</th>
            <th>Pagi</th>
            <th>Siang</th>
            <th>Malam</th>
        </tr>
        <tr>
            <td rowspan="2">Senin</td>
            <td>Olahraga</td>
            <td>Makan</td>
            <td>Belajar</td>
        </tr>
        <tr>
            <td>Kerja</td>
            <td>Istirahat</td>
            <td>Tidur</td>
        </tr>
    </table>

</body>
</html>
