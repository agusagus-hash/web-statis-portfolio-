<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Soal 3 - Rowspan</title>
</head>
<body>

    <table border="1">
        <tr>
            <th>Hari</th>
            <th>Mata Pelajaran</th>
        </tr>
        <tr>
            <td rowspan="2">Senin</td>
            <td>Matematika</td>
        </tr>
        <tr>
            <td>Bahasa Indonesia</td>
        </tr>
        <tr>
            <td rowspan="2">Selasa</td>
            <td>IPA</td>
        </tr>
        <tr>
            <td>IPS</td>
        </tr>
    </table>

</body>
</html>
